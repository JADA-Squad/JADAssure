# Render Blueprint (decision 0004). Render → New → Blueprint → JADA-Squad/JADAssure.
# Every push to main rebuilds the root Dockerfile and redeploys the same URL.

databases:
  - name: jadassure-db
    plan: free            # free Postgres expires after 30 days on Render; upgrade before relying on it
    region: frankfurt
    databaseName: jadassure
    user: jadassure

services:
  - type: web
    name: jadassure
    runtime: docker
    plan: free            # free instances sleep after ~15 min idle; first request then takes ~1 min
    region: frankfurt
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jadassure-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # One service runs API, worker loop and the React app (no free background workers on Render).
      - key: EMBEDDED_WORKER
        value: "true"
      # Loads the three synthetic DEMO orgs on first start; idempotent on later deploys.
      - key: SEED_DEMO_ON_START
        value: "true"
      # Public URL: never list demo logins/passwords, and don't let strangers create orgs (decision 0002 D-7).
      - key: SHOW_DEMO_ACCOUNTS
        value: "false"
      - key: ALLOW_SIGNUP
        value: "false"
      - key: LOG_LEVEL
        value: INFO
