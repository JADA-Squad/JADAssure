[project]
name = "jadassure"
version = "0.1.0"
description = "JADAssure revenue assurance API and worker"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "email-validator>=2.2,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<3.3",
    "pyjwt>=2.10,<3",
    "bcrypt>=4.2,<5",
    "python-multipart>=0.0.17,<0.1",
    "pypdf>=5.1,<6",
    "python-docx>=1.1,<2",
    "anthropic>=2.3,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.28,<0.29",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["acceptance: end-to-end acceptance scenarios (QA-001)"]
filterwarnings = ["error::DeprecationWarning:app.*"]
